[project]
name = "tournant"
version = "0.1.0"
description = "Raspberry Pi Bluetooth-SPP printer interceptor for kitchen order tablets"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tournant*"]
